version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
  formatters:
    enable:
      - gofmt
      - goimports
  exclusions:
    rules:
      # Tests may have relaxed rules.
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
