version: 2

project_name: aiagent

before:
  hooks:
    - go mod tidy

builds:
  - id: agent
    main: ./cmd/agent
    binary: aiagent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - config.yaml.example

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull_request
      - Merge branch

release:
  github:
    owner: {{ .Env.GITHUB_OWNER }}
    name: {{ .Env.GITHUB_REPO }}
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Release {{ .Tag }}
    
    {{ range .ExtraRefs }}
    - {{ . }}
    {{ end }}
  footer: |
    **Full Changelog**: https://github.com/{{ .Env.GITHUB_OWNER }}/{{ .Env.GITHUB_REPO }}/compare/{{ .PreviousTag }}...{{ .Tag }}
    
    ### Thank you to our contributors:
    {{ range .Commits }}
    - {{ .Author.Name }}
    {{ end }}

# Binary releases for quick download
binaries:
  - id: agent
    main: ./cmd/agent
    binary: aiagent
    extension: ""
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

# Source archives
source:
  enabled: true

# Homebrew formula
brews:
  - name: aiagent
    repository:
      owner: {{ .Env.GITHUB_OWNER }}
      name: homebrew-tap
    homepage: https://github.com/{{ .Env.GITHUB_OWNER }}/{{ .Env.GITHUB_REPO }}
    description: "Interactive CLI AI agent for GigaChat API"
    license: "MIT"
    test: |
      system "#{bin}/aiagent --version"
    install: |
      bin.install "aiagent"
